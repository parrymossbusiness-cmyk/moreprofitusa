<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fairfield 3D SimCity: Homebuyer Survival Quest | Otis White Jr.</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
  
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Three.js + OrbitControls (Git-City 3D WebGL Engine) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <!-- Schema Markup for AEO / GEO -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Fairfield 3D Homebuyer Survival Quest",
    "applicationCategory": "GameApplication",
    "operatingSystem": "Web Browser",
    "author": {
      "@type": "RealEstateAgent",
      "name": "Otis White Jr.",
      "url": "https://otiswhitejrrealty.com",
      "areaServed": "Fairfield, CA"
    }
  }
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #E5E0D8;
      background-image: 
        radial-gradient(#C4BCB0 1.5px, transparent 1.5px),
        linear-gradient(to bottom, rgba(229,224,216,0.9), #E5E0D8);
      background-size: 20px 20px, 100% 100%;
      font-family: 'JetBrains Mono', monospace;
      color: #111;
      padding: 16px 8px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    @keyframes popFloatUp {
      0% { opacity: 0; transform: translateY(10px) scale(0.8); }
      20% { opacity: 1; transform: translateY(-5px) scale(1.1); }
      100% { opacity: 0; transform: translateY(-30px) scale(1); }
    }
    @keyframes screenShake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(3px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-5px, 0, 0); }
      40%, 60% { transform: translate3d(5px, 0, 0); }
    }
    @keyframes cardSlideIn {
      0% { opacity: 0; transform: translateY(12px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .anim-shake { animation: screenShake 0.35s cubic-bezier(.36,.07,.19,.97) both; }
    .anim-slide { animation: cardSlideIn 0.22s ease-out forwards; }

    button {
      font-family: 'JetBrains Mono', monospace;
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }
    button:active {
      transform: translate(2px, 2px) !important;
      box-shadow: 1px 1px 0px #000 !important;
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 8-Bit Web Audio Synthesizer
    const playSfx = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        const now = ctx.currentTime;
        if (type === 'coin') {
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.setValueAtTime(880, now + 0.08);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        } else if (type === 'hit') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(160, now);
          osc.frequency.exponentialRampToValueAtTime(40, now + 0.25);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        }
      } catch(e) {}
    };

    const DISTRICTS = {
      cordelia: {
        name: "Cordelia Junction",
        tag: "Commuter Bastion",
        median: 720000,
        melloRoos: 3200,
        hoa: 185,
        targetX: -12,
        lore: "I-80 & I-680 intersection. Solano's commute launchpad to SF & Walnut Creek."
      },
      greenValley: {
        name: "Green Valley / Eastridge",
        tag: "Wine Country Rim",
        median: 910000,
        melloRoos: 1800,
        hoa: 340,
        targetX: 0,
        lore: "Vineyards and rolling hills. Quick 15m cruise into Napa's Coombsville pocket."
      },
      central: {
        name: "Downtown / Travis Corridor",
        tag: "Historic & Military Hub",
        median: 535000,
        melloRoos: 0,
        hoa: 0,
        targetX: 12,
        lore: "County Seat center. Near Travis AFB, Allan Witt Park, and historic 1859 Waterman roots."
      }
    };

    // === THREE.JS 3D PROCEDURAL CITY ENGINE (srizzon/git-city Inspired) ===
    function ThreeCityCanvas({ districtKey }) {
      const mountRef = useRef(null);
      const sceneRef = useRef(null);
      const cameraRef = useRef(null);

      useEffect(() => {
        const container = mountRef.current;
        if (!container) return;

        const width = container.clientWidth;
        const height = container.clientHeight;

        // 1. Scene Setup
        const scene = new THREE.Scene();
        sceneRef.current = scene;
        scene.background = new THREE.Color(0xDCECF4);
        scene.fog = new THREE.Fog(0xDCECF4, 35, 75);

        // 2. Isometric Orthographic-Style Perspective Camera
        const camera = new THREE.PerspectiveCamera(40, width / height, 1, 1000);
        camera.position.set(22, 28, 32);
        cameraRef.current = camera;

        // 3. Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // 4. Touch & Orbit Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.maxPolarAngle = Math.PI / 2.15; // Don't go below ground
        controls.minDistance = 15;
        controls.maxDistance = 55;
        controls.target.set(0, 0, 0);

        // 5. Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfff6d5, 0.95);
        dirLight.position.set(30, 45, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        // 6. Ground Grid & Roads
        const groundGeo = new THREE.PlaneGeometry(100, 100);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x82A860 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // I-80 Asphalt Highway Strip
        const roadGeo = new THREE.PlaneGeometry(100, 4.5);
        const roadMat = new THREE.MeshLambertMaterial({ color: 0x333339 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.set(0, 0.05, 8);
        road.receiveShadow = true;
        scene.add(road);

        // 7. Procedural Pixel Buildings (Git-City Voxel Architecture)
        const buildingMatWhite = new THREE.MeshLambertMaterial({ color: 0xFDFBF7 });
        const buildingMatTan = new THREE.MeshLambertMaterial({ color: 0xEAD8B5 });
        const buildingMatGreen = new THREE.MeshLambertMaterial({ color: 0xB8D8A0 });
        const roofMat = new THREE.MeshLambertMaterial({ color: 0x933D2D });
        const windowMatLit = new THREE.MeshBasicMaterial({ color: 0xFFE066 });

        // Generate 3 Districts in 3D Space
        const districtConfigs = [
          { key: 'cordelia', xOffset: -14, count: 12, heightRange: [2.5, 5], color: buildingMatTan },
          { key: 'greenValley', xOffset: 0, count: 10, heightRange: [4.5, 9], color: buildingMatWhite },
          { key: 'central', xOffset: 14, count: 14, heightRange: [2, 4], color: buildingMatGreen }
        ];

        districtConfigs.forEach(d => {
          for (let i = 0; i < d.count; i++) {
            const h = d.heightRange[0] + Math.random() * (d.heightRange[1] - d.heightRange[0]);
            const w = 1.8 + Math.random() * 0.8;
            const bGeo = new THREE.BoxGeometry(w, h, w);
            const building = new THREE.Mesh(bGeo, d.color);
            
            const row = Math.floor(i / 4);
            const col = i % 4;
            const z = (row * 3.5) - 6;
            const x = d.xOffset + ((col - 1.5) * 2.8) + (Math.random() * 0.4);

            building.position.set(x, h / 2, z);
            building.castShadow = true;
            building.receiveShadow = true;
            scene.add(building);

            // Roof Cap
            const rGeo = new THREE.BoxGeometry(w * 0.95, 0.35, w * 0.95);
            const roof = new THREE.Mesh(rGeo, roofMat);
            roof.position.set(x, h + 0.18, z);
            roof.castShadow = true;
            scene.add(roof);

            // Lit Pixel Window Feature (srizzon git-city signature)
            if (Math.random() > 0.4) {
              const winGeo = new THREE.BoxGeometry(0.35, 0.45, w + 0.05);
              const win = new THREE.Mesh(winGeo, windowMatLit);
              win.position.set(x, h * 0.65, z);
              scene.add(win);
            }
          }
        });

        // 8. Animated Traffic Mesh
        const carGeo = new THREE.BoxGeometry(0.9, 0.5, 0.5);
        const carMatRed = new THREE.MeshLambertMaterial({ color: 0xFF3B30 });
        const carMatBlue = new THREE.MeshLambertMaterial({ color: 0x007AFF });
        const car1 = new THREE.Mesh(carGeo, carMatRed);
        const car2 = new THREE.Mesh(carGeo, carMatBlue);
        car1.position.set(-25, 0.35, 7.2);
        car2.position.set(25, 0.35, 8.8);
        scene.add(car1);
        scene.add(car2);

        // 9. Render Loop
        let animId;
        const animate = () => {
          animId = requestAnimationFrame(animate);

          // Animate traffic on I-80
          car1.position.x += 0.12;
          if (car1.position.x > 35) car1.position.x = -35;
          car2.position.x -= 0.09;
          if (car2.position.x < -35) car2.position.x = 35;

          controls.update();
          renderer.render(scene, camera);
        };
        animate();

        // Handle Resizing
        const handleResize = () => {
          if (!container) return;
          const w = container.clientWidth;
          const h = container.clientHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        };
        window.addEventListener('resize', handleResize);

        return () => {
          cancelAnimationFrame(animId);
          window.removeEventListener('resize', handleResize);
          if (renderer.domElement && container.contains(renderer.domElement)) {
            container.removeChild(renderer.domElement);
          }
          renderer.dispose();
        };
      }, []);

      // Smooth Camera Fly-Through on District Switch
      useEffect(() => {
        if (!cameraRef.current) return;
        const targetX = DISTRICTS[districtKey].targetX;
        // Smooth pan camera toward the chosen district
        const startX = cameraRef.current.position.x;
        const destX = targetX + 16;
        let step = 0;
        const panInterval = setInterval(() => {
          step += 0.05;
          cameraRef.current.position.x = THREE.MathUtils.lerp(startX, destX, step);
          if (step >= 1) clearInterval(panInterval);
        }, 16);
        return () => clearInterval(panInterval);
      }, [districtKey]);

      return (
        <div 
          ref={mountRef} 
          style={{ width: '100%', height: '100%', position: 'relative', cursor: 'grab' }}
        />
      );
    }

    // === MAIN GAME APPLICATION ===
    function App() {
      const [stage, setStage] = useState(1);
      const [districtKey, setDistrictKey] = useState('cordelia');
      const [cash, setCash] = useState(95000);
      const [sanity, setSanity] = useState(85);
      const [bisScore, setBisScore] = useState(30);
      const [buyerClass, setBuyerClass] = useState('Tech Commuter');
      const [shaking, setShaking] = useState(false);
      const [floatingText, setFloatingText] = useState(null);
      const [gameOver, setGameOver] = useState(null);
      const [leadSent, setLeadSent] = useState(false);
      const [phone, setPhone] = useState('');

      const dist = DISTRICTS[districtKey];

      // Dynamic Solano County Math
      const loan = Math.max(0, dist.median - cash);
      const monthlyPI = Math.round((loan * (0.065 / 12)) / (1 - Math.pow(1 + 0.065 / 12, -360)));
      const monthlyTax = Math.round((dist.median * 0.0119) / 12);
      const monthlyCFD = Math.round(dist.melloRoos / 12);
      const totalNut = monthlyPI + monthlyTax + monthlyCFD + dist.hoa;

      const showFloatingPopup = (text, color = '#CCFF00') => {
        setFloatingText({ text, color });
        setTimeout(() => setFloatingText(null), 1200);
      };

      const triggerShake = () => {
        setShaking(true);
        setTimeout(() => setShaking(false), 380);
      };

      const pickClass = (title, startingCash, startingSanity) => {
        playSfx('coin');
        setBuyerClass(title);
        setCash(startingCash);
        setSanity(startingSanity);
        setBisScore(bisScore + 15);
        showFloatingPopup(`+$${(startingCash/1000)}k Bank!`, '#CCFF00');
        setStage(2);
      };

      const selectDistrict = (key) => {
        playSfx('coin');
        setDistrictKey(key);
        setBisScore(bisScore + 15);
        showFloatingPopup(`Flying to ${DISTRICTS[key].name}!`, '#7000FF');
      };

      const handleCommuteChoice = (mode) => {
        if (mode === 'drive') {
          playSfx('hit');
          triggerShake();
          setSanity(Math.max(10, sanity - 30));
          setBisScore(bisScore + 10);
          showFloatingPopup(`-30% Sanity (I-80 Bottleneck!)`, '#FF4D4D');
        } else {
          playSfx('coin');
          setCash(cash - 1200);
          setSanity(Math.min(100, sanity + 15));
          setBisScore(bisScore + 20);
          showFloatingPopup(`+15% Sanity (Amtrak WiFi Perk!)`, '#CCFF00');
        }
        setStage(4);
      };

      const handleLoreChoice = (answer) => {
        if (answer === 'correct') {
          playSfx('coin');
          setCash(cash + 2500);
          setBisScore(bisScore + 15);
          showFloatingPopup(`+$2,500 Waterman Civic Grant!`, '#CCFF00');
        } else {
          playSfx('hit');
          triggerShake();
          setSanity(sanity - 10);
          showFloatingPopup(`-10% Sanity (Civic Penalty)`, '#FF4D4D');
        }
        setStage(5);
      };

      const handleEscrowChoice = (waive) => {
        if (waive) {
          playSfx('hit');
          triggerShake();
          setGameOver({
            title: "ESCROW NIGHTMARE: Cordelia AC & Dry Rot Shock",
            desc: "You waived inspection to beat 3 Bay Area cash offers. HVAC compressor blew and foundation dry rot was discovered.",
            loss: "-$24,000 Surprise Repair Bill"
          });
        } else {
          playSfx('coin');
          setCash(cash - 850);
          setBisScore(bisScore + 20);
          showFloatingPopup(`Protected By 7-Day Contingency!`, '#7000FF');
          setStage(6);
        }
      };

      return (
        <div className={shaking ? 'anim-shake' : ''} style={{
          maxWidth: '560px',
          width: '100%',
          background: '#FFFDF9',
          border: '3px solid #111',
          padding: '16px',
          boxShadow: '8px 8px 0px #111',
          position: 'relative',
          overflow: 'hidden'
        }}>

          {/* Floating Game Popups */}
          {floatingText && (
            <div style={{
              position: 'absolute',
              top: '40%',
              left: '50%',
              transform: 'translateX(-50%)',
              background: floatingText.color,
              color: '#111',
              border: '2px solid #111',
              padding: '6px 14px',
              fontWeight: '900',
              fontSize: '13px',
              zIndex: 999,
              boxShadow: '3px 3px 0px #111',
              animation: 'popFloatUp 1.2s forwards',
              pointerEvents: 'none'
            }}>
              {floatingText.text}
            </div>
          )}

          {/* Top Arcade HUD */}
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '3px solid #111', paddingBottom: '10px', marginBottom: '12px' }}>
            <div>
              <span style={{ background: '#CCFF00', padding: '3px 8px', fontWeight: '800', fontSize: '11px', border: '2px solid #111', boxShadow: '2px 2px 0px #111' }}>
                FAIRFIELD 3D SIMCITY
              </span>
              <div style={{ fontSize: '10px', marginTop: '4px', color: '#666', fontWeight: '700' }}>
                SOLANO ENGINE • STAGE {stage} OF 6
              </div>
            </div>
            <div style={{ textAlign: 'right' }}>
              <div style={{ fontSize: '9px', fontWeight: '700', color: '#888' }}>INTENT RATING</div>
              <div style={{ fontSize: '19px', fontWeight: '900', color: bisScore >= 70 ? '#7000FF' : '#111' }}>
                {bisScore}/100
              </div>
            </div>
          </div>

          {/* === 3D WEBGL INTERACTIVE CITY VIEWPORT === */}
          <div style={{
            height: '180px',
            border: '3px solid #111',
            borderRadius: '4px',
            position: 'relative',
            overflow: 'hidden',
            marginBottom: '14px',
            boxShadow: 'inset 0 0 10px rgba(0,0,0,0.1)'
          }}>
            <ThreeCityCanvas districtKey={districtKey} />

            {/* In-Canvas Floating Badge */}
            <div style={{
              position: 'absolute',
              top: '8px',
              left: '8px',
              background: 'rgba(255,255,255,0.92)',
              border: '2px solid #111',
              padding: '3px 8px',
              fontSize: '10px',
              fontWeight: '800',
              boxShadow: '2px 2px 0px #111',
              pointerEvents: 'none'
            }}>
              📍 {dist.name.toUpperCase()} (SWIPE 3D TO EXPLORE)
            </div>

            <div style={{
              position: 'absolute',
              bottom: '6px',
              right: '8px',
              background: 'rgba(204,255,0,0.95)',
              border: '2px solid #111',
              padding: '2px 6px',
              fontSize: '9px',
              fontWeight: '800',
              pointerEvents: 'none'
            }}>
              MEDIAN: ${(dist.median / 1000)}K
            </div>
          </div>

          {/* Living HUD Stats */}
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '6px', marginBottom: '14px' }}>
            <div style={{ border: '2px solid #111', padding: '6px', background: '#FFF', boxShadow: '2px 2px 0px #111' }}>
              <div style={{ fontSize: '9px', color: '#666', fontWeight: '700' }}>LIQUID CASH</div>
              <div style={{ fontSize: '15px', fontWeight: '900' }}>${cash.toLocaleString()}</div>
            </div>
            <div style={{ border: '2px solid #111', padding: '6px', background: '#FFF', boxShadow: '2px 2px 0px #111' }}>
              <div style={{ fontSize: '9px', color: '#666', fontWeight: '700' }}>SANITY / ENERGY</div>
              <div style={{ fontSize: '15px', fontWeight: '900', color: sanity < 50 ? '#FF4D4D' : '#00A86B' }}>
                {sanity}% {sanity < 50 ? '⚠️' : '⚡'}
              </div>
            </div>
            <div style={{ border: '2px solid #111', padding: '6px', background: '#FFF', boxShadow: '2px 2px 0px #111' }}>
              <div style={{ fontSize: '9px', color: '#666', fontWeight: '700' }}>EST. MONTHLY</div>
              <div style={{ fontSize: '15px', fontWeight: '900' }}>${totalNut.toLocaleString()}</div>
            </div>
          </div>

          {/* === STAGE 1: Character Select === */}
          {stage === 1 && (
            <div className="anim-slide" style={{ border: '3px solid #111', padding: '14px', background: '#FFF', boxShadow: '4px 4px 0px #111' }}>
              <div style={{ fontSize: '10px', color: '#7000FF', fontWeight: '800' }}>STAGE 01: CHOOSE YOUR CHARACTER</div>
              <h3 style={{ fontFamily: 'Space Grotesk', fontSize: '16px', margin: '4px 0 10px 0' }}>Who is braving the Solano housing market?</h3>
              
              <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                <button onClick={() => pickClass("SF/Oakland Tech Commuter", 130000, 75)} style={{
                  padding: '10px', background: '#FFF', border: '2px solid #111', textAlign: 'left', cursor: 'pointer', boxShadow: '3px 3px 0px #111'
                }}>
                  <strong>💻 SF/Oakland Hybrid Commuter</strong>
                  <div style={{ fontSize: '11px', color: '#555', marginTop: '2px' }}>Starting Cash: $130,000 | Sanity: 75% | Trapped on I-80</div>
                </button>

                <button onClick={() => pickClass("Travis AFB / Defense Family", 45000, 95)} style={{
                  padding: '10px', background: '#FFF', border: '2px solid #111', textAlign: 'left', cursor: 'pointer', boxShadow: '3px 3px 0px #111'
                }}>
                  <strong>🎖️ Travis AFB / Public Servant</strong>
                  <div style={{ fontSize: '11px', color: '#555', marginTop: '2px' }}>Starting Cash: $45,000 | Sanity: 95% | VA 0% Down Benefit</div>
                </button>

                <button onClick={() => pickClass("Local Solano Upgrader", 90000, 90)} style={{
                  padding: '10px', background: '#FFF', border: '2px solid #111', textAlign: 'left', cursor: 'pointer', boxShadow: '3px 3px 0px #111'
                }}>
                  <strong>🏡 Local Solano Upgrader</strong>
                  <div style={{ fontSize: '11px', color: '#555', marginTop: '2px' }}>Starting Cash: $90,000 | Sanity: 90% | Escaping rental inflation</div>
                </button>
              </div>
            </div>
          )}

          {/* === STAGE 2: Interactive Territory / District Pick === */}
          {stage === 2 && (
            <div className="anim-slide" style={{ border: '3px solid #111', padding: '14px', background: '#FFF', boxShadow: '4px 4px 0px #111' }}>
              <div style={{ fontSize: '10px', color: '#7000FF', fontWeight: '800' }}>STAGE 02: SELECT TARGET FAIRFIELD TERRAIN</div>
              <h3 style={{ fontFamily: 'Space Grotesk', fontSize: '16px', margin: '4px 0 10px 0' }}>Tap to fly 3D camera to district:</h3>
              
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '8px', marginBottom: '12px' }}>
                {Object.keys(DISTRICTS).map((k) => (
                  <div key={k} onClick={() => selectDistrict(k)} style={{
                    border: '2px solid #111',
                    padding: '10px 4px',
                    textAlign: 'center',
                    background: districtKey === k ? '#CCFF00' : '#F7F4EB',
                    boxShadow: districtKey === k ? '3px 3px 0px #7000FF' : '2px 2px 0px #111',
                    cursor: 'pointer',
                    transform: districtKey === k ? 'translateY(-3px)' : 'none',
                    transition: 'all 0.1s ease'
                  }}>
                    <div style={{ fontSize: '18px', marginBottom: '2px' }}>
                      {k === 'greenValley' ? '🍷' : k === 'cordelia' ? '🚗' : '🏡'}
                    </div>
                    <div style={{ fontSize: '10px', fontWeight: '800' }}>{DISTRICTS[k].name.split(' ')[0]}</div>
                    <div style={{ fontSize: '9px', color: '#555' }}>${(DISTRICTS[k].median/1000)}k</div>
                  </div>
                ))}
              </div>

              <div style={{ border: '2px dashed #111', padding: '8px', fontSize: '11px', background: '#FAFAFA', marginBottom: '12px' }}>
                <div><strong>{dist.name} ({dist.tag})</strong></div>
                <div style={{ color: '#555', marginTop: '4px' }}>{dist.lore}</div>
                <div style={{ marginTop: '6px', fontWeight: '700' }}>
                  CFD Mello-Roos Tax: ${dist.melloRoos}/yr | HOA: ${dist.hoa}/mo
                </div>
              </div>

              <button onClick={() => setStage(3)} style={{
                width: '100%', padding: '12px', background: '#CCFF00', border: '2px solid #111', fontWeight: '800', cursor: 'pointer', boxShadow: '3px 3px 0px #111'
              }}>
                LOCK IN {dist.name.toUpperCase()} & ADVANCE
              </button>
            </div>
          )}

          {/* === STAGE 3: Commute / Transit Gauntlet === */}
          {stage === 3 && (
            <div className="anim-slide" style={{ border: '3px solid #111', padding: '14px', background: '#FFF', boxShadow: '4px 4px 0px #111' }}>
              <div style={{ fontSize: '10px', color: '#7000FF', fontWeight: '800' }}>STAGE 03: THE CORRIDOR COMMUTE DILEMMA</div>
              <h3 style={{ fontFamily: 'Space Grotesk', fontSize: '16px', margin: '4px 0 8px 0' }}>How do you get to the job center?</h3>
              <p style={{ fontSize: '12px', color: '#444', lineHeight: '1.4', marginBottom: '12px' }}>
                Fairfield spans 41.6 sq miles. Living in {dist.name} means navigating the I-80/680 junction or using the Capitol Corridor line.
              </p>

              <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                <button onClick={() => handleCommuteChoice('drive')} style={{
                  padding: '10px', background: '#FFF', border: '2px solid #111', textAlign: 'left', cursor: 'pointer', boxShadow: '3px 3px 0px #111'
                }}>
                  <strong>🚗 Brave I-80 Solo Drive</strong>
                  <div style={{ fontSize: '11px', color: '#555' }}>Cost: $0 upfront | Risk: Traffic bottleneck drains -30% Sanity</div>
                </button>

                <button onClick={() => handleCommuteChoice('train')} style={{
                  padding: '10px', background: '#FFF', border: '2px solid #111', textAlign: 'left', cursor: 'pointer', boxShadow: '3px 3px 0px #111'
                }}>
                  <strong>🚆 Fairfield-Vacaville Hannigan Train Pass</strong>
                  <div style={{ fontSize: '11px', color: '#555' }}>Cost: $1,200/yr | Reward: Coffee, WiFi, +15% Sanity Boost</div>
                </button>
              </div>
            </div>
          )}

          {/* === STAGE 4: Local History & Civic Trivia Buff === */}
          {stage === 4 && (
            <div className="anim-slide" style={{ border: '3px solid #111', padding: '14px', background: '#FFF', boxShadow: '4px 4px 0px #111' }}>
              <div style={{ fontSize: '10px', color: '#7000FF', fontWeight: '800' }}>STAGE 04: CIVIC TRIVIA & CITY HALL PERK</div>
              <h3 style={{ fontFamily: 'Space Grotesk', fontSize: '16px', margin: '4px 0 8px 0' }}>Fairfield City Knowledge Check</h3>
              <p style={{ fontSize: '12px', color: '#444', lineHeight: '1.4', marginBottom: '12px' }}>
                Mayor Rick Vaccaro's City Council and industrial engines (Jelly Belly & Anheuser-Busch) power the municipal tax base. Prove you know Fairfield:
              </p>
              
              <div style={{ background: '#FFFDF0', border: '2px dashed #111', padding: '8px', fontSize: '11px', marginBottom: '12px' }}>
                <strong>Trivia:</strong> Who founded Fairfield in 1859 and named it after his Connecticut hometown?
              </div>

              <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                <button onClick={() => handleLoreChoice('correct')} style={{
                  padding: '10px', background: '#CCFF00', border: '2px solid #111', textAlign: 'left', cursor: 'pointer', boxShadow: '3px 3px 0px #111', fontWeight: '700'
                }}>
                  ⚓ Clipper Ship Captain Robert H. Waterman (+$2,500 City Credit)
                </button>
                <button onClick={() => handleLoreChoice('wrong')} style={{
                  padding: '10px', background: '#FFF', border: '2px solid #111', textAlign: 'left', cursor: 'pointer', boxShadow: '3px 3px 0px #111'
                }}>
                  General Mariano Vallejo (Penalty: -10% Sanity)
                </button>
              </div>
            </div>
          )}

          {/* === STAGE 5: Escrow Gauntlet === */}
          {stage === 5 && !gameOver && (
            <div className="anim-slide" style={{ border: '3px solid #111', padding: '14px', background: '#FFF', boxShadow: '4px 4px 0px #111' }}>
              <div style={{ fontSize: '10px', color: '#FF4D4D', fontWeight: '800' }}>STAGE 05: THE MULTIPLE-OFFER PRESSURE COOKER</div>
              <h3 style={{ fontFamily: 'Space Grotesk', fontSize: '16px', margin: '4px 0 8px 0' }}>Offer Table in {dist.name}</h3>
              <p style={{ fontSize: '12px', color: '#444', lineHeight: '1.4', marginBottom: '12px' }}>
                Your ${dist.median.toLocaleString()} offer is tied with a Bay Area all-cash investor. The seller wants you to waive property and roof inspections right now.
              </p>

              <div style={{ display: 'flex', gap: '8px' }}>
                <button onClick={() => handleEscrowChoice(true)} style={{
                  flex: 1, padding: '12px 6px', background: '#FF4D4D', color: '#FFF', border: '2px solid #111', fontWeight: '800', cursor: 'pointer', boxShadow: '3px 3px 0px #111', fontSize: '11px'
                }}>
                  Waive Inspection (Risky)
                </button>
                <button onClick={() => handleEscrowChoice(false)} style={{
                  flex: 1, padding: '12px 6px', background: '#CCFF00', border: '2px solid #111', fontWeight: '800', cursor: 'pointer', boxShadow: '3px 3px 0px #111', fontSize: '11px'
                }}>
                  Stand Firm on Inspection (-$850)
                </button>
              </div>
            </div>
          )}

          {/* GAME OVER (Rage Bait / Viral Screen) */}
          {gameOver && (
            <div className="anim-shake" style={{ border: '3px solid #FF4D4D', padding: '16px', background: '#FFF', textAlign: 'center', boxShadow: '5px 5px 0px #FF4D4D' }}>
              <div style={{ fontSize: '11px', fontWeight: '800', color: '#FF4D4D' }}>ESCROW REJECTED</div>
              <h3 style={{ margin: '8px 0', fontFamily: 'Space Grotesk', fontSize: '17px' }}>{gameOver.title}</h3>
              <p style={{ fontSize: '12px', color: '#555', marginBottom: '10px' }}>{gameOver.desc}</p>
              <div style={{ fontSize: '14px', fontWeight: '800', color: '#FF4D4D', marginBottom: '12px' }}>{gameOver.loss}</div>
              <button onClick={() => { setGameOver(null); setStage(1); setSanity(85); setCash(95000); }} style={{
                padding: '10px 20px', background: '#111', color: '#FFF', border: 'none', fontWeight: '800', cursor: 'pointer', boxShadow: '3px 3px 0px #CCFF00'
              }}>
                RETRY SIMULATION
              </button>
            </div>
          )}

          {/* === STAGE 6: VICTORY & HIGH-INTENT LEAD ROUTING === */}
          {stage === 6 && (
            <div className="anim-slide" style={{ border: '3px solid #7000FF', padding: '16px', background: '#FFF', boxShadow: '5px 5px 0px #7000FF' }}>
              <div style={{ fontSize: '10px', color: '#7000FF', fontWeight: '800' }}>MISSION COMPLETE: KEYS UNLOCKED</div>
              <h3 style={{ fontFamily: 'Space Grotesk', fontSize: '17px', margin: '4px 0 8px 0' }}>
                YOU SURVIVED FAIRFIELD, CA
              </h3>
              <p style={{ fontSize: '12px', lineHeight: '1.4', color: '#333', marginBottom: '12px' }}>
                You conquered the Solano transfer tax, survived the I-80 commute, and protected your reserves. Your estimated total monthly nut in {dist.name} is <strong>${totalNut.toLocaleString()}/mo</strong>.
              </p>

              {!leadSent ? (
                <form onSubmit={(e) => { e.preventDefault(); setLeadSent(true); }} style={{ marginTop: '10px' }}>
                  <label style={{ fontSize: '11px', fontWeight: '800', display: 'block', marginBottom: '6px' }}>
                    ENTER PHONE TO DISPATCH YOUR VERIFIED FAIRFIELD ESCROW ACTION PLAN:
                  </label>
                  <input 
                    type="tel"
                    placeholder="(707) 555-0144"
                    value={phone}
                    onChange={(e) => setPhone(e.target.value)}
                    required
                    style={{ width: '100%', padding: '10px', border: '2px solid #111', marginBottom: '8px', fontFamily: 'monospace', fontWeight: '700' }}
                  />
                  <button type="submit" style={{
                    width: '100%', padding: '12px', background: '#7000FF', color: '#FFF', border: '2px solid #111', fontWeight: '800', cursor: 'pointer', boxShadow: '3px 3px 0px #111'
                  }}>
                    DISPATCH PLAN TO OTIS WHITE JR.
                  </button>
                </form>
              ) : (
                <div style={{ background: '#CCFF00', padding: '10px', border: '2px solid #111', fontSize: '12px', fontWeight: '800', boxShadow: '2px 2px 0px #111' }}>
                  🎯 Dossier Dispatched! Otis White Jr. will text your custom Cordelia/Green Valley feasibility report shortly.
                </div>
              )}
            </div>
          )}

          {/* Footer Branding */}
          <div style={{ textAlign: 'center', marginTop: '14px', fontSize: '10px', color: '#888', fontWeight: '600' }}>
            MOREPROFITUSA AI ENGINE • PROUD PARTNER OF OTIS WHITE JR. REALTY
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
